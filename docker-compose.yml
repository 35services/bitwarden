services:
  vaultwarden:
    image: vaultwarden/server:${VAULTWARDEN_VERSION:-latest}
    container_name: vaultwarden
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN}
      SIGNUPS_ALLOWED: ${SIGNUPS_ALLOWED:-false}
      # Admin panel (/admin) is disabled while ADMIN_TOKEN is empty.
      ADMIN_TOKEN: ${ADMIN_TOKEN:-}
      WEBSOCKET_ENABLED: "true"
      TZ: ${TZ:-UTC}
    volumes:
      # SQLite db, attachments, sends, RSA keys, config.json all live here.
      - ./data/vaultwarden:/data
    networks:
      - internal
    # No ports published: reached only through Caddy below.

  caddy:
    image: caddy:2
    container_name: vaultwarden-caddy
    restart: unless-stopped
    depends_on:
      - vaultwarden
    environment:
      DOMAIN_HOST: ${DOMAIN_HOST}
      HTTPS_PORT: ${HTTPS_PORT:-8443}
    ports:
      - "${HTTPS_PORT:-8443}:${HTTPS_PORT:-8443}"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./data/caddy/data:/data     # includes the local CA root certificate
      - ./data/caddy/config:/config
    networks:
      - internal

networks:
  internal:
    name: vaultwarden_internal
